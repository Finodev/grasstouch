# =====================================================
#                  GrassRegrow Config
# =====================================================

# Общий выключатель плагина.
# false - плагин полностью бездействует (трава не возрождается вообще)
enabled: true

# --- Короткая трава (обычная, 1 блок) ---
short-grass:
  enabled: true
  # Через сколько секунд после поломки короткая трава появится снова
  respawn-seconds: 60

# --- Высокая / длинная трава (2 блока в высоту) ---
tall-grass:
  enabled: true
  # Через сколько секунд после поломки высокая трава появится снова
  respawn-seconds: 180

# Не запускать возрождение, если игрок сломал траву в режиме Creative
ignore-creative-mode: false

# Перед тем как поставить траву обратно, проверять,
# что место всё ещё пустое (воздух). Если там уже что-то стоит
# (игрок построил блок), трава там не появится.
check-location-before-respawn: true
