name: GrassRegrow
version: '1.0.0'
main: ru.example.grassregrow.GrassRegrowPlugin
api-version: '1.21'
author: YourName
description: Возрождает сломанную траву (короткую и высокую) через заданное время на том же месте.

commands:
  grassregrow:
    description: Управление плагином GrassRegrow
    usage: /<command> reload|settime <short|tall> <секунды>|toggle <all|short|tall>|status
    permission: grassregrow.admin
    aliases: [gr]

permissions:
  grassregrow.admin:
    description: Доступ к командам администрирования плагина GrassRegrow
    default: op
